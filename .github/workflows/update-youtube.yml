name: Refresh YouTube uploads

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: true

      - name: Install latest yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh feed
        run: python scripts/update_youtube.py

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "No video changes."
          else
            git commit -m "chore: refresh YouTube uploads"
            git push
          fi
